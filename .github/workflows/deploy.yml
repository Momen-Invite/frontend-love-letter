name: Deploy to Production (SSH Tar)

on:
  push:
    branches:
      - master

jobs:
  deploy:
    name: 🚀 Build & Deploy to cPanel
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # 1. Ambil kode terbaru dari GitHub
      - name: 🚚 Checkout code
        uses: actions/checkout@v4

      # 2. Setup Node.js 24 (sesuai .nvmrc & package.json engines)
      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # 3. Install semua dependencies (termasuk devDeps untuk build)
      - name: 📦 Install dependencies
        run: npm ci

      # 4. Build Next.js (standalone output → .next/standalone/server.js)
      - name: 🏗️ Build Next.js
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1

      # 5. Salin public/ dan .next/static ke dalam standalone bundle
      #    (standalone tidak menyertakan ini secara otomatis)
      - name: 📂 Prepare standalone bundle
        run: |
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static

      # 6. Kompres bundle standalone menjadi deploy.tar.gz
      - name: 📦 Compress standalone bundle
        run: |
          tar -czvf deploy.tar.gz \
            --exclude='*.tsbuildinfo' \
            -C .next/standalone \
            .

      # 7. Upload ke server cPanel via SCP
      - name: 🚀 Upload via SCP
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deploy.tar.gz"
          target: /home/uucdjd7c/rzkydev666.my.id

      # 8. Ekstrak di server, lalu restart aplikasi Node.js via cPanel touch
      - name: 🛠️ Extract & Restart on Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /home/uucdjd7c/rzkydev666.my.id

            # Ekstrak bundle baru (timpa file lama)
            tar -xzvf deploy.tar.gz
            rm -f deploy.tar.gz

            # Restart Node.js app di cPanel (touch server.js = trigger auto-restart)
            touch server.js

            echo "✅ Deploy selesai!"
